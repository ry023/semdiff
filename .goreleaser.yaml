# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: semdiff

builds:
  - id: semdiff
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w

archives:
  - formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: checksums.txt

release:
  # tagpr creates the draft release and its release notes first.
  use_existing_draft: true
  mode: keep-existing

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
